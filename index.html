<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lock In">
  <meta name="theme-color" content="#ff4500">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Lock In Timer</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --fire: #ff4500;
  --fire-bright: #ff6b00;
  --fire-glow: #ff450044;
  --fire-dim: #ff450077;
  --fire-muted: #ff450033;
  --green: #7fff00;
  --green-glow: #7fff0044;
  --green-dim: #7fff0077;
  --green-muted: #7fff0033;
  --bg: #0f0f0f;
  --bg-warm: #1a0800;
  --bg-cool: #0d1a00;
  --text: #ffffff;
  --transition: 0.6s ease;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  color: var(--text);
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 28px 24px 32px;
  gap: 18px;
  background: linear-gradient(160deg, var(--bg), var(--bg-warm));
  transition: background var(--transition);
}

#app.break {
  background: linear-gradient(160deg, var(--bg), var(--bg-cool));
}

/* Header */
.header { text-align: center; }

.mode-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--fire);
  transition: color var(--transition);
}

#app.break .mode-label { color: var(--green); }

.session-info {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--fire-dim);
  margin-top: 4px;
  transition: color var(--transition);
}

#app.break .session-info { color: var(--green-dim); }

/* Ring */
.ring-wrap {
  position: relative;
  width: 220px;
  height: 220px;
}

.ring-wrap svg { transform: rotate(-90deg); }

.ring-bg {
  fill: none;
  stroke: var(--bg-warm);
  stroke-width: 14;
  transition: stroke var(--transition);
}

#app.break .ring-bg { stroke: var(--bg-cool); }

.ring-progress {
  fill: none;
  stroke: var(--fire);
  stroke-width: 14;
  stroke-linecap: round;
  stroke-dashoffset: 0;
  filter: drop-shadow(0 0 10px var(--fire));
  transition: stroke var(--transition), filter var(--transition), stroke-dashoffset 0.5s linear;
}

#app.break .ring-progress {
  stroke: var(--green);
  filter: drop-shadow(0 0 10px var(--green));
}

.ring-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.countdown {
  font-size: 48px;
  font-weight: 800;
  color: var(--fire-bright);
  text-shadow: 0 0 30px var(--fire-glow);
  letter-spacing: -2px;
  line-height: 1;
  transition: color var(--transition), text-shadow var(--transition);
}

#app.break .countdown {
  color: var(--green);
  text-shadow: 0 0 30px var(--green-glow);
}

.ring-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--fire-dim);
  margin-top: 6px;
  transition: color var(--transition);
}

#app.break .ring-label { color: var(--green-dim); }

/* Quote */
.quote-box {
  text-align: center;
  max-width: 340px;
  min-height: 64px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  justify-content: center;
}

.quote-text {
  font-size: 12px;
  line-height: 1.7;
  color: #cccccc;
  font-style: italic;
  opacity: 0;
  transition: opacity 0.8s ease;
}

.quote-text.visible { opacity: 1; }

.quote-category {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--fire-dim);
  transition: color var(--transition);
}

#app.break .quote-category { color: var(--green-dim); }

/* Break tasks */
.break-tasks {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  max-width: 300px;
}

.break-task {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--green-dim);
  letter-spacing: 1px;
  font-weight: 500;
}

.break-task span { font-size: 16px; }

/* Divider */
.divider {
  width: 100%;
  max-width: 300px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--fire-muted), transparent);
  transition: background var(--transition);
}

#app.break .divider {
  background: linear-gradient(90deg, transparent, var(--green-muted), transparent);
}

/* Stats */
.stats-row {
  display: flex;
  gap: 32px;
  justify-content: center;
}

.stat { text-align: center; }

.stat-num {
  font-size: 22px;
  font-weight: 800;
  color: var(--fire-bright);
  transition: color var(--transition);
}

#app.break .stat-num { color: var(--green); }

.stat-label {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--fire-dim);
  margin-top: 2px;
  transition: color var(--transition);
}

#app.break .stat-label { color: var(--green-dim); }

/* Buttons */
.btn-row {
  display: flex;
  gap: 12px;
  align-items: center;
}

.btn-start {
  background: linear-gradient(135deg, #ff4500, #ff8c00);
  border: none;
  border-radius: 50px;
  padding: 15px 36px;
  font-size: 12px;
  font-weight: 800;
  font-family: inherit;
  color: #fff;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 0 24px var(--fire-glow);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn-start:active { transform: scale(0.97); }
.btn-start:disabled { opacity: 0.5; cursor: default; pointer-events: none; }

.btn-stop {
  background: transparent;
  border: 1px solid var(--fire-muted);
  border-radius: 50px;
  padding: 15px 20px;
  font-size: 12px;
  font-family: inherit;
  color: var(--fire-dim);
  letter-spacing: 1px;
  cursor: pointer;
  transition: border-color 0.2s ease;
}

.btn-stop:hover { border-color: var(--fire-dim); }

#app.break .btn-stop {
  border-color: var(--green-muted);
  color: var(--green-dim);
  transition: border-color 0.2s ease, color 0.6s ease;
}

#app.break .btn-stop:hover { border-color: var(--green-dim); }

/* Utilities */
.hidden { display: none !important; }

.notif-blocked {
  font-size: 10px;
  color: #555;
  letter-spacing: 1px;
}
  </style>
</head>
<body>
  <div id="app">
  <!-- Header -->
  <div class="header">
    <div id="modeLabel" class="mode-label">🔥 Lock In</div>
    <div id="sessionInfo" class="session-info">SESSION 0 · TODAY</div>
  </div>

  <!-- Ring -->
  <div class="ring-wrap">
    <svg id="ringSvg" viewBox="0 0 220 220" width="220" height="220">
      <circle class="ring-bg" cx="110" cy="110" r="95"/>
      <circle id="ringProgress" class="ring-progress" cx="110" cy="110" r="95"/>
    </svg>
    <div class="ring-center">
      <div id="countdown" class="countdown">30:00</div>
      <div id="ringLabel" class="ring-label">READY</div>
    </div>
  </div>

  <!-- Quote -->
  <div id="quoteBox" class="quote-box">
    <div id="quoteText" class="quote-text"></div>
    <div id="quoteCategory" class="quote-category"></div>
  </div>

  <!-- Break tasks (hidden during lock-in) -->
  <div id="breakTasks" class="break-tasks hidden">
    <div class="break-task"><span>💪</span> 10 Push Ups — Go Now</div>
    <div class="break-task"><span>🚶</span> Step Away. Reset Your Mind.</div>
    <div class="break-task"><span>💧</span> Drink Water</div>
  </div>

  <!-- Divider -->
  <div class="divider"></div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat">
      <div id="statSessions" class="stat-num">0</div>
      <div class="stat-label">Sessions</div>
    </div>
    <div class="stat">
      <div id="statTime" class="stat-num">0m</div>
      <div class="stat-label">Locked In</div>
    </div>
    <div class="stat">
      <div id="statSets" class="stat-num">0</div>
      <div class="stat-label">Push Sets</div>
    </div>
  </div>

  <!-- Divider -->
  <div class="divider"></div>

  <!-- Buttons -->
  <div class="btn-row">
    <button id="stopBtn" class="btn-stop hidden" onclick="stopTimer()">■ Stop</button>
    <button id="startBtn" class="btn-start" onclick="handleStart()">🔥 START LOCKING IN</button>
  </div>

  <!-- Notification blocked indicator -->
  <div id="notifBlocked" class="notif-blocked hidden">🔕 Notifications blocked — sound only</div>
</div>
  <script>
    // ─── CONFIG ───────────────────────────────────────────────
    const LOCKIN_MS  = 30 * 60 * 1000;  // 30 minutes
    const BREAK_MS   = 10 * 60 * 1000;  // 10 minutes
    const QUOTE_INTERVAL_MS = 10 * 60 * 1000; // rotate quote every 10 min

    // ─── STATE ────────────────────────────────────────────────
    const state = {
      phase: 'idle',        // 'idle' | 'lockin' | 'break'
      remaining: LOCKIN_MS,
      startedAt: null,
      tickInterval: null,
      quoteInterval: null,
      notifPermission: 'default',
    };

    // ─── STATS (localStorage) ─────────────────────────────────
    function getTodayKey() {
      return new Date().toDateString();
    }

    function loadStats() {
      const key = getTodayKey();
      try {
        const raw = localStorage.getItem('lockin_stats');
        if (!raw) return { date: key, sessions: 0, totalMs: 0, pushupSets: 0 };
        const data = JSON.parse(raw);
        if (data.date !== key) return { date: key, sessions: 0, totalMs: 0, pushupSets: 0 };
        return data;
      } catch(e) {
        return { date: key, sessions: 0, totalMs: 0, pushupSets: 0 };
      }
    }

    function saveStats(stats) {
      try {
        localStorage.setItem('lockin_stats', JSON.stringify(stats));
      } catch(e) { /* in-memory only if storage fails */ }
    }

    let stats = loadStats();

    // ─── TIMER ENGINE ─────────────────────────────────────────
    function startPhase(phase) {
      state.phase = phase;
      state.remaining = phase === 'lockin' ? LOCKIN_MS : BREAK_MS;
      state.startedAt = Date.now();
      clearInterval(state.tickInterval);
      state.tickInterval = setInterval(tick, 500);
      render();
    }

    function tick() {
      const elapsed = Date.now() - state.startedAt;
      state.remaining = (state.phase === 'lockin' ? LOCKIN_MS : BREAK_MS) - elapsed;

      if (state.remaining <= 0) {
        state.remaining = 0;
        onPhaseEnd();
        return;
      }
      render();
    }

    function onPhaseEnd() {
      clearInterval(state.tickInterval);

      if (state.phase === 'lockin') {
        // Lock in complete → go to break
        stats.sessions++;
        stats.totalMs += LOCKIN_MS;
        stats.pushupSets++;
        saveStats(stats);
        playChime();
        sendNotification('Break time 💪', '10 push ups. Step away. Reset.');
        startPhase('break');
      } else {
        // Break complete → back to lock in
        playChime();
        sendNotification('🔥 Lock In', 'Straight calls. No excuses.');
        startPhase('lockin');
      }
    }

    function stopTimer() {
      if (state.phase === 'idle') return;
      clearInterval(state.tickInterval);
      clearInterval(state.quoteInterval);
      if (state.phase === 'lockin' && state.startedAt) {
        stats.totalMs += Date.now() - state.startedAt;
        saveStats(stats);
      }
      state.phase = 'idle';
      state.remaining = LOCKIN_MS;
      render();
    }

    function handleStart() {
      requestNotifPermission().then(() => {
        startQuoteRotation();
        showNextQuote();
        startPhase('lockin');
      });
    }

    // ─── FORMAT ───────────────────────────────────────────────
    function fmtTime(ms) {
      const total = Math.max(0, Math.ceil(ms / 1000));
      const m = Math.floor(total / 60).toString().padStart(2, '0');
      const s = (total % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function fmtDuration(ms) {
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m`;
    }

    // ─── SOUND (Web Audio API) ────────────────────────────────
    let _audioCtx = null;
    function getAudioCtx() {
      if (!_audioCtx) {
        _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      // Resume if suspended (browsers suspend AudioContext until user gesture)
      if (_audioCtx.state === 'suspended') _audioCtx.resume();
      return _audioCtx;
    }

    function playChime() {
      try {
        const ctx = getAudioCtx();
        const notes = [523.25, 659.25, 783.99]; // C5, E5, G5 — major chord
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          const t = ctx.currentTime + i * 0.18;
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.3, t + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
          osc.start(t);
          osc.stop(t + 0.9);
        });
      } catch(e) { /* silent fail */ }
    }

    // ─── NOTIFICATIONS ────────────────────────────────────────
    async function requestNotifPermission() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') return;
      const result = await Notification.requestPermission();
      state.notifPermission = result;
      const blocked = document.getElementById('notifBlocked');
      if (result !== 'granted') {
        blocked.classList.remove('hidden');
      }
    }

    function sendNotification(title, body) {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;
      new Notification(title, { body, icon: '/icon-192.png', silent: false });
    }

    // ─── QUOTES ───────────────────────────────────────────────
    const QUOTES = [
      // LAW OF DETACHMENT
      { text: "The law of detachment isn't giving up — it's the highest form of trust. Do the work so fully that you no longer need the outcome to validate you. Dial the number. Release the result.", category: "Law of Detachment" },
      { text: "You want this so badly you can feel it in your chest. Good. Now put that wanting down and pick up the work. The universe responds to action, not desperation. Do the rep. Trust the process.", category: "Law of Detachment" },
      { text: "Attachment to the outcome is the thief of your peace. You cannot control whether they say yes. You can only control whether you made the call. Make the call.", category: "Law of Detachment" },
      { text: "The moment you stop needing the result is the moment you become unstoppable. Not because you stopped caring — but because you stopped letting fear of failure make your decisions.", category: "Law of Detachment" },
      { text: "Every call you make is a seed planted in soil you cannot see. You don't dig up seeds to check if they're growing. You water them every single day and trust the harvest is coming.", category: "Law of Detachment" },
      { text: "Detachment is not indifference. It is the absolute commitment to the input, with zero dependency on the output. The work is your only job. The result is the universe's.", category: "Law of Detachment" },
      { text: "Stop calculating the odds. Stop measuring how close you are. The person who locks in without counting the score is the one who eventually stops counting because they've already won.", category: "Law of Detachment" },
      { text: "You are not building toward a moment. You are becoming someone. Each rep, each call, each session — that's the becoming. The results are just proof of who you already decided to be.", category: "Law of Detachment" },
      { text: "Release the how. Release the when. Keep only the what: I will make the calls. I will show up. I will do the work. Everything else is not your department.", category: "Law of Detachment" },
      { text: "The fastest way to get what you want is to stop desperately needing it and start completely trusting that your daily inputs will deliver it. Work the process. Release the timeline.", category: "Law of Detachment" },
      { text: "There is freedom in the rep. You don't have to know if it's working. You just have to do it. The person who keeps dialing without obsessing over the scoreboard outlasts everyone who stopped to check.", category: "Law of Detachment" },
      { text: "Detachment is not passive. It is the most aggressive form of faith — working at full intensity while trusting completely that the effort compounds even when you can't see it.", category: "Law of Detachment" },
      { text: "One call does not build a life. But the habit of making calls every single day — without quitting when it's hard, without needing each one to win — that is what builds everything.", category: "Law of Detachment" },
      { text: "Your energy is for the input. Not for worrying about the output. Every calorie of anxiety you burn on results is a calorie stolen from the work. Do the work. Trust the rest.", category: "Law of Detachment" },
      { text: "You are not chasing this. You are becoming the person it is chasing. The work you put in right now — every session, every call — is the becoming. Stop chasing. Start becoming.", category: "Law of Detachment" },
      { text: "The harvest never arrives on the same day as the planting. Do not stand in the field looking for fruit you planted an hour ago. Lock in. Water the seeds. Trust the season.", category: "Law of Detachment" },
      { text: "The outcome is none of your business. Your only business is this: did you show up fully? Did you make the call? Did you lock in? Everything else is out of your jurisdiction.", category: "Law of Detachment" },
      { text: "Faith is not believing something will happen. Faith is continuing to work as if it already has — every single day, especially the ones that feel like nothing is moving.", category: "Law of Detachment" },
      { text: "What would it look like to stop white-knuckling the result and just do the work with open hands? That is detachment. That is freedom. That is the session you are in right now.", category: "Law of Detachment" },
      { text: "The person who needs the yes to keep going will eventually stop. The person who calls regardless of the answer will eventually get everything. Be the second person.", category: "Law of Detachment" },

      // LAW OF ATTRACTION
      { text: "You do not attract what you want. You attract what you are. Who you are right now — in this session, on this call, with this effort — that is what is coming back to you.", category: "Law of Attraction" },
      { text: "The life you want already exists. The version of you making those calls without hesitation, without fear, with full belief — that is the signal. This session is you tuning in.", category: "Law of Attraction" },
      { text: "Every thought you hold about what you're building, every call you make as if it's already working — that is not wishful thinking. That is the exact frequency that draws it to you.", category: "Law of Attraction" },
      { text: "Act as if. Not because you're faking it — but because the person who already has what you want acts exactly like someone who does the work every single day without needing permission.", category: "Law of Attraction" },

      { text: "Belief is not a feeling. It's a decision that shows up in your behavior. You decide to believe by picking up the phone. By opening the laptop. By starting the session instead of scrolling.", category: "Law of Attraction" },
      { text: "You cannot think your way into a different life. But you can think like the person who already lives it — and then move like them, work like them, lock in like them — until you are them.", category: "Law of Attraction" },
      { text: "The energy you carry into this session is the invitation you send to the universe. Bring intensity. Bring intention. Bring the unshakeable belief that this work is building something real.", category: "Law of Attraction" },
      { text: "Success leaves a signal. That signal is not luck or timing — it's the frequency of someone who shows up every single day and does the uncomfortable thing without waiting to feel ready.", category: "Law of Attraction" },
      { text: "What you consistently do becomes what you consistently attract. Consistent calls attract consistent clients. Consistent work attracts consistent results. This session is not small.", category: "Law of Attraction" },
      { text: "Your dominant thought is your order to the universe. Right now — for the next thirty minutes — let your dominant thought be: I am someone who locks in, does the work, and does not quit.", category: "Law of Attraction" },

      { text: "Confine yourself to the present. The last call doesn't matter. The next call hasn't happened. This moment, this session, this effort — that is all that is real and all that is yours.", category: "Stoic" },
      { text: "How long are you going to wait before you demand the best for yourself? You already know what needs to be done. The discipline is not in knowing — it's in the thirty minutes you're in right now.", category: "Stoic" },

      { text: "Do not indulge in expectations of what isn't in your control. Make the call you can make. Show up for the session you can show up for. That is the entire scope of your responsibility.", category: "Stoic" },
      { text: "The sun also rises on those who did not earn it. But the life you want rises only on those who worked for it when they didn't feel like it. That is what separates. This session is that separation.", category: "Stoic" },
      { text: "Think of yourself as dead. You have lived your life. Now take what's left and live it properly. The procrastination ends when you truly feel the weight of the time that does not return.", category: "Stoic" },
      { text: "Luck is what happens when preparation meets opportunity. You are in preparation right now. Every session is preparation. The opportunity will come — and you will be someone who was ready.", category: "Stoic" },
      { text: "If it is not right, do not do it. If it is not true, do not say it. And if the work is what builds the life — then do the work. Not tomorrow. Not after one more scroll. Now.", category: "Stoic" },
      { text: "The best revenge is to be unlike those who caused the injury. The best answer to doubt — yours or anyone else's — is to lock in and build something they cannot argue with.", category: "Stoic" },
      { text: "He who is brave is free. The scroll is safe. The call is brave. The session is brave. Every time you choose the work over the comfort, you are exercising the only freedom that matters.", category: "Stoic" },
      { text: "You have survived every hard day you have ever had. Your track record of getting through difficult sessions is 100%. Remember that when this one feels hard.", category: "Stoic" },
      { text: "The whole future lies in uncertainty. Live immediately. Not tomorrow when it feels better. Not after one more scroll. The only session that counts is the one happening right now.", category: "Stoic" },
      { text: "It is not that I am so smart. It is just that I stay with problems longer. Stay with the session. Stay with the calls. The ones who outlast the discomfort are the ones who build everything.", category: "Stoic" },
      { text: "Difficulties strengthen the mind as labour does the body. The call that feels impossible to make is the exact call that makes you into someone who can close anything.", category: "Stoic" },
      { text: "Remember that you are an actor in a play. Your job is not to choose the length — it is to play your part well. Your part right now is to lock in. Play it with everything you have.", category: "Stoic" },
      { text: "What we do now echoes in eternity. This session echoes. This call echoes. The pattern of showing up when it's hard — that is what compounds into a life you can look back on and respect.", category: "Stoic" },
      { text: "Seek not that the things which happen should happen as you wish; but wish the things which happen to be as they are, and you will have a tranquil flow of life. Work the process. Release the outcome.", category: "Stoic" },

      // LAW OF DETACHMENT (additional)
      { text: "You cannot pour from an empty cup, but you also cannot fill the cup by staring at it. Every session is water in the cup. Fill it completely. Trust it will pour when it needs to.", category: "Law of Detachment" },
      { text: "Stop asking if it's working. That question belongs to the outcome, and the outcome is not your responsibility right now. Your responsibility is this call. Then the next one. Then the next.", category: "Law of Detachment" },
      { text: "The universe rewards consistency, not intensity. Anyone can lock in once when they're fired up. The one who locks in every single day — even when it feels pointless — that is the one it rewards.", category: "Law of Detachment" },
      { text: "Let go of the scoreboard. The scoreboard is a distraction from the game. You win by playing better — not by watching the numbers more obsessively. Play the game in front of you.", category: "Law of Detachment" },
      { text: "Trust is doing the work without needing a receipt. You put in the input. The output is handled. This is not naivety — it is the most disciplined form of focus that exists.", category: "Law of Detachment" },

      // LAW OF ATTRACTION (additional)
      { text: "The gap between where you are and where you want to be is not closed by thinking about the gap. It is closed by being the person on the other side — right now, in this session, on this call.", category: "Law of Attraction" },
      { text: "You don't attract what you need. You attract what you match. Match the energy of the person who has already built the life. Lock in. Move like them. Work like them. Become them.", category: "Law of Attraction" },
      { text: "Vision without action is daydreaming. Action without vision is just busy. You have the vision. Now make this thirty minutes the action that proves the vision is real to you.", category: "Law of Attraction" },
      { text: "Every time you choose the work over the scroll, you send a signal to the universe: I am serious. I am ready. Every time you choose the scroll, you send the opposite. Choose wisely, right now.", category: "Law of Attraction" },
      { text: "The life you want is already vibrating at the frequency of someone who does the work without hesitation. Close the gap. Vibrate at that frequency. Start with this session.", category: "Law of Attraction" },

      // STOIC (additional)
      { text: "You are always practicing. Always. Either you are practicing discipline or you are practicing avoidance. Either you are practicing presence or you are practicing distraction. What are you practicing right now?", category: "Stoic" },
      { text: "Don't explain yourself to people who won't understand. Don't defend your grind to those who don't share it. Lock in. Let the results speak. Results require no translation.", category: "Stoic" },
      { text: "The quality of your life is the quality of your habits. A habit is what you do when you don't feel like it. This session — especially if you didn't feel like starting it — is a habit being built.", category: "Stoic" },
      { text: "Memento mori. Remember you will die. Not to fill you with fear — but to fill you with urgency. The calls you leave unmade. The sessions you skip. The life unbuilt. That is what is worth fearing.", category: "Stoic" },
      { text: "Amor fati. Love your fate. Love the hard session. Love the call that doesn't answer. Love the grind that no one sees. This is not your punishment — this is your path. Love every step of it.", category: "Stoic" },
    ];

    let quoteQueue = [];
    let currentQuoteIdx = 0;

    function shuffleQuotes() {
      quoteQueue = [...QUOTES];
      for (let i = quoteQueue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [quoteQueue[i], quoteQueue[j]] = [quoteQueue[j], quoteQueue[i]];
      }
      currentQuoteIdx = 0;
    }

    function showNextQuote() {
      if (quoteQueue.length === 0 || currentQuoteIdx >= quoteQueue.length) shuffleQuotes();
      const q = quoteQueue[currentQuoteIdx++];
      const textEl = document.getElementById('quoteText');
      const catEl  = document.getElementById('quoteCategory');
      textEl.classList.remove('visible');
      setTimeout(() => {
        textEl.textContent = `"${q.text}"`;
        catEl.textContent  = q.category;
        textEl.classList.add('visible');
      }, 400);
    }

    function startQuoteRotation() {
      clearInterval(state.quoteInterval);
      state.quoteInterval = setInterval(showNextQuote, QUOTE_INTERVAL_MS);
    }

    // ─── RENDER ───────────────────────────────────────────────
    const RING_CIRCUMFERENCE = 2 * Math.PI * 95; // r=95 → ~597

    function render() {
      const app        = document.getElementById('app');
      const modeLabel  = document.getElementById('modeLabel');
      const sessionInfo = document.getElementById('sessionInfo');
      const countdown  = document.getElementById('countdown');
      const ringLabel  = document.getElementById('ringLabel');
      const ringProgress = document.getElementById('ringProgress');
      const breakTasks = document.getElementById('breakTasks');
      const startBtn   = document.getElementById('startBtn');
      const stopBtn    = document.getElementById('stopBtn');
      const statSessions = document.getElementById('statSessions');
      const statTime   = document.getElementById('statTime');
      const statSets   = document.getElementById('statSets');

      const isBreak = state.phase === 'break';
      const isIdle  = state.phase === 'idle';

      // Phase class
      app.classList.toggle('break', isBreak);

      // Mode label
      modeLabel.textContent = isBreak ? '💪 Break Time' : '🔥 Lock In';

      // Session info
      sessionInfo.textContent = `SESSION ${stats.sessions} · TODAY`;

      // Countdown
      countdown.textContent = fmtTime(state.remaining);

      // Ring label
      ringLabel.textContent = isIdle ? 'READY' : (isBreak ? 'BREAK LEFT' : 'REMAINING');

      // Ring progress (dashoffset = circumference * (1 - progress))
      const total = isBreak ? BREAK_MS : LOCKIN_MS;
      const progress = isIdle ? 1 : Math.max(0, state.remaining / total);
      const offset = RING_CIRCUMFERENCE * (1 - progress);
      ringProgress.style.strokeDasharray = RING_CIRCUMFERENCE;
      ringProgress.style.strokeDashoffset = offset;

      // Break tasks visibility
      breakTasks.classList.toggle('hidden', !isBreak);

      // Buttons
      startBtn.classList.toggle('hidden', !isIdle);
      stopBtn.classList.toggle('hidden', isIdle);

      // Stats
      statSessions.textContent = stats.sessions;
      statTime.textContent = fmtDuration(stats.totalMs);
      statSets.textContent = stats.pushupSets;
    }

    // Initial render on load
    document.addEventListener('DOMContentLoaded', () => {
      render();
      if (typeof showNextQuote === 'function') showNextQuote();
    });

    // Service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
